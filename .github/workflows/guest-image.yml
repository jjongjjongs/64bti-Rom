name: guest-image

# 게스트 이미지(kernel + ramdisk + system.img)를 조립해서 아티팩트로 올린다.
#
# PC 없이 폰만으로 작업하는 경우를 위한 것이다. 러너에는 Android SDK, NDK, 네트워크,
# 리눅스 도구가 모두 있으므로 docs/GUEST-IMAGE.md 의 PC 작업을 대신할 수 있다.
# 완성된 android7-guest.zip 을 폰에서 내려받아 앱의 "Android 7 구성 가져오기"로
# 임포트하면 된다.
#
# 무겁기 때문에 수동 실행(workflow_dispatch)만 한다.

on:
  # 기본 브랜치에 있어야 workflow_dispatch 가 노출되므로, 작업 브랜치에서도 돌 수 있게
  # 게스트 관련 파일이 바뀔 때만 뜨는 push 트리거를 함께 둔다.
  push:
    paths:
      - "guest/**"
      - ".github/workflows/guest-image.yml"
  workflow_dispatch:
    inputs:
      api_level:
        description: "게스트 Android API 레벨 (24 = Android 7.0)"
        default: "24"
      userdata_size:
        description: "userdata.img 크기"
        default: "2G"

# 디버깅 루프를 도는 동안 커밋을 연달아 밀면 예전 커밋의 런이 25분씩 계속 돌면서
# 러너를 붙들고, 어차피 읽지도 않는다. 같은 브랜치에서는 최신 런만 남긴다.
concurrency:
  group: guest-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show disk space before
        run: df -h /

      - name: Install guest system image
        env:
          API: ${{ inputs.api_level || '24' }}
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "system-images;android-$API;default;armeabi-v7a"

      # 첫 실행의 목적 절반은 "SDK 이미지가 실제로 어떤 파일을 주는가"를 확인하는 것이다.
      # 여기 출력이 이후 단계의 근거가 된다.
      - name: Inspect what the SDK actually shipped
        id: inspect
        env:
          API: ${{ inputs.api_level || '24' }}
        run: |
          SYSIMG="$ANDROID_HOME/system-images/android-$API/default/armeabi-v7a"
          echo "SYSIMG=$SYSIMG" >> "$GITHUB_ENV"
          echo "## 시스템 이미지 디렉터리" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -la "$SYSIMG" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "## 파일 종류" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for f in "$SYSIMG"/*; do
            [ -f "$f" ] || continue
            printf '%-24s %s\n' "$(basename "$f")" "$(file -b "$f")" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cpio zip android-sdk-libsparse-utils qemu-utils e2fsprogs

      - name: Build guest helpers (static ARM32, NDK)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK=$NDK"
          export ANDROID_NDK_HOME="$NDK" API_LEVEL=${{ inputs.api_level || '24' }}
          guest/init_wrapper/build.sh "$GITHUB_WORKSPACE/init.wrapper"
          guest/qemu_pipe/build.sh   "$GITHUB_WORKSPACE"
          file "$GITHUB_WORKSPACE/init.wrapper" "$GITHUB_WORKSPACE/qemu_piped" \
               "$GITHUB_WORKSPACE/pipetest"

      # SDK 의 kernel-ranchu 는 goldfish 보드용이라 -machine virt 에서 무음으로 죽는다(실측).
      # Debian 대조군으로 나머지 배관은 정상임을 확인했고, 거기서 안드로이드 init 이
      # SELinux 부재로 죽는 것까지 봤다. 그래서 필요한 건 "virt 에서 뜨면서 안드로이드
      # 기능이 켜진 ARM32 커널" 하나다. ashmem 이 5.18 에서 제거됐으므로 5.10 을 쓴다.
      # 커널 빌드는 15분쯤 걸리는데 결과물은 스크립트가 바뀌지 않는 한 매번 같다.
      # 디버깅 루프를 도는 동안 그 시간이 반복 비용의 대부분이라 캐시한다.
      - name: Cache built kernel
        id: kcache
        uses: actions/cache@v4
        with:
          # 설정 요약도 함께 캐시한다. 캐시가 적중하면 빌드 단계가 통째로 스킵되는데,
          # 그러면 "이 커널이 어떤 설정인지"를 확인할 방법이 사라진다.
          path: |
            kernel-virt-android
            kernel-config.txt
          key: kernel-${{ hashFiles('guest/kernel/build-kernel.sh') }}

      - name: Build Android-capable ARM32 kernel for virt
        id: kbuild
        if: steps.kcache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          KERNEL_BRANCH: android12-5.10-lts
        run: guest/kernel/build-kernel.sh "$GITHUB_WORKSPACE/kernel-virt-android"

      - name: Assemble guest images
        env:
          USERDATA_SIZE: ${{ inputs.userdata_size || '2G' }}
        run: |
          set -euo pipefail
          WORK="$GITHUB_WORKSPACE/guest-out"
          mkdir -p "$WORK"

          # --- kernel ---
          # 직접 빌드한 virt 용 커널이 있으면 그것이 우선. SDK 의 kernel-ranchu 는
          # -machine virt 에서 부팅하지 못하는 것이 실측으로 확인됐다(무음 종료).
          KERNEL=""
          if [ -f "$GITHUB_WORKSPACE/kernel-virt-android" ]; then
            KERNEL="$GITHUB_WORKSPACE/kernel-virt-android"
          else
            echo "::warning::직접 빌드한 커널이 없어 SDK kernel-ranchu 로 폴백합니다 (부팅 실패가 예상됨)"
            for name in kernel-ranchu kernel-qemu kernel; do
              if [ -f "$SYSIMG/$name" ]; then KERNEL="$SYSIMG/$name"; break; fi
            done
          fi
          if [ -z "$KERNEL" ]; then
            echo "::error::시스템 이미지 패키지에 커널이 없습니다. 위 inspect 출력 확인 필요."
            exit 1
          fi
          echo "커널: $KERNEL"
          cp "$KERNEL" "$WORK/kernel"

          # --- system.img (sparse / qcow2 면 raw 로 변환) ---
          SYS="$SYSIMG/system.img"
          [ -f "$SYS" ] || { echo "::error::system.img 없음"; exit 1; }
          case "$(file -b "$SYS")" in
            *"Android sparse image"*) echo "sparse -> raw"; simg2img "$SYS" "$WORK/system.img" ;;
            *QCOW*)                   echo "qcow2 -> raw";  qemu-img convert -O raw "$SYS" "$WORK/system.img" ;;
            *)                        cp "$SYS" "$WORK/system.img" ;;
          esac

          # 게스트의 init.wrapper 가 ext4 라벨로 장치를 찾아 fstab 을 고쳐 쓴다.
          # cache/userdata 는 mkfs 할 때 라벨을 주지만 SDK 의 system.img 라벨은
          # 보장되지 않으므로 여기서 정한다.
          echo "system.img 라벨(원본): '$(e2label "$WORK/system.img" 2>&1 || true)'"
          e2label "$WORK/system.img" system
          echo "system.img 라벨(설정): '$(e2label "$WORK/system.img")'"

          # --- ramdisk: init.wrapper 를 넣어 재패킹 ---
          RD="$SYSIMG/ramdisk.img"
          [ -f "$RD" ] || { echo "::error::ramdisk.img 없음"; exit 1; }
          mkdir -p "$WORK/rd" && cd "$WORK/rd"
          case "$(file -b "$RD")" in
            *gzip*) zcat "$RD" | cpio -idm ;;
            *LZ4*)  lz4 -dc "$RD" | cpio -idm ;;
            *)      cpio -idm < "$RD" ;;
          esac
          cp "$GITHUB_WORKSPACE/init.wrapper" ./init.wrapper
          chmod 750 ./init.wrapper
          cp "$GITHUB_WORKSPACE/qemu_piped" ./qemu_piped
          cp "$GITHUB_WORKSPACE/pipetest"   ./pipetest
          chmod 750 ./qemu_piped ./pipetest

          # healthd 는 -machine virt 에서 abort 한다(TEST_POWER 를 넣어도 여전하므로
          # 전원 장치 부재가 원인은 아니다). critical 만 떼었더니 무한 재시작하며
          # 로그를 도배해 정작 그 뒤가 보이지 않았다. 배터리 UI 라 게임 구동에는
          # 필요 없으므로 서비스 자체를 끈다.
          if [ -f init.rc ]; then
            awk '
              /^service[ \t]+healthd/ { inblk=1 }
              /^service[ \t]/ && !/healthd/ { inblk=0 }
              inblk { print "# [disabled] " $0; next }
              { print }
            ' init.rc > init.rc.new && mv init.rc.new init.rc
            echo "init.rc healthd 블록:"; awk '/^service[ \t]+healthd/,/^$/' init.rc | head -6

            # ueventd 콜드부트 이후 안드로이드는 logcat 으로만 로그를 남긴다. 시리얼에는
            # 아무것도 안 나와서 "멈춘 것"과 "조용히 진행 중"이 구분되지 않는다.
            # logcat 을 콘솔로 흘리는 서비스를 심어 그 뒤를 보이게 한다.
            {
              echo ""
              echo "service seriallogcat /system/bin/logcat -b all -v threadtime"
              echo "    class core"
              echo "    console"
              echo "    seclabel u:r:shell:s0"
              echo "    group log readproc"
            } >> init.rc
            echo "seriallogcat 서비스 추가됨"

            # /dev/qemu_pipe 를 CUSE 로 제공하는 데몬. surfaceflinger 보다 먼저 떠야
            # 하므로 on post-fs 에서 시작한다(class_start core 보다 앞선다).
            # pipetest 는 동시 파이프가 실제로 되는지 확인하는 시험용이라 그 뒤에 돈다.
            {
              echo ""
              echo "service qemu_piped /qemu_piped"
              echo "    class core"
              echo "    seclabel u:r:init:s0"
              echo ""
              echo "service pipetest /pipetest"
              echo "    class core"
              echo "    oneshot"
              echo "    disabled"
              echo "    seclabel u:r:init:s0"
            } >> init.rc
            awk '
              /^on post-fs$/ { print; print "    start qemu_piped"; print "    start pipetest"; next }
              { print }
            ' init.rc > init.rc.new && mv init.rc.new init.rc
            grep -q "start qemu_piped" init.rc \
              && echo "qemu_piped 를 on post-fs 에 넣었음" \
              || echo "::warning::on post-fs 를 못 찾아 qemu_piped 가 일찍 시작되지 않습니다"
          fi
          # fstab.ranchu 에서 /data 만 fs_mgr 플래그에 check 를 달고 있다(/system, /cache 는
          # wait 뿐). 마운트되는 것과 안 되는 것의 차이가 정확히 이것 하나다.
          #
          # check 는 fs_mgr 이 e2fsck 를 돌리게 한다. 그런데 최근 SDK 시스템 이미지는
          # 라이선스 문제로 e2fsck 를 빼고 배포하며, 우리는 어차피 매번 mkfs.ext4 로
          # 갓 만든 깨끗한 파일시스템을 넘긴다. 검사할 것이 없다.
          if [ -f fstab.ranchu ]; then
            echo "fstab.ranchu (원본):"; grep -n "/data" fstab.ranchu || true
            sed -i 's/wait,check/wait/g' fstab.ranchu
            echo "fstab.ranchu (수정):"; grep -n "/data" fstab.ranchu || true
          fi

          find . | cpio -o -H newc | gzip > "$WORK/ramdisk.img"
          cd "$GITHUB_WORKSPACE"

          # 재패킹 검증: 래퍼가 들어갔고 원래 init 이 남아 있어야 한다
          zcat "$WORK/ramdisk.img" | cpio -t 2>/dev/null > /tmp/rd.list
          grep -qx "init.wrapper" /tmp/rd.list || { echo "::error::init.wrapper 가 램디스크에 없음"; exit 1; }
          grep -qx "init"         /tmp/rd.list || { echo "::error::원래 init 이 사라짐"; exit 1; }
          grep -qx "qemu_piped" /tmp/rd.list || { echo "::error::qemu_piped 가 램디스크에 없음"; exit 1; }
          grep -qx "pipetest"   /tmp/rd.list || { echo "::error::pipetest 가 램디스크에 없음"; exit 1; }
          echo "램디스크 재패킹 검증 통과"

          # --- userdata / cache ---
          # 순서가 곧 vda/vdb/vdc 이고, Android 7 fstab.ranchu 는
          #   vda=/system, vdb=/cache, vdc=/data 를 기대한다(실측).
          #
          # SDK 의 userdata.img 를 복사해서 truncate + resize2fs 하는 방식은 원본 크기와
          # 기능 플래그에 의존해 깨지기 쉽다. 실제로 /data(vdc)가 마운트되지 않았다.
          # 빈 파일시스템을 새로 만든다 — 안드로이드가 첫 부팅에 알아서 채운다.
          #
          # metadata_csum / 64bit 는 끈다. Android 7 시절 e2fsprogs·fs_mgr 이 모르는
          # 기능이라 켜져 있으면 마운트나 fsck 단계에서 거부당할 수 있다.
          MKE2FS_OPTS="-q -F -O ^metadata_csum,^64bit -b 4096"
          mkfs.ext4 $MKE2FS_OPTS -L cache "$WORK/cache.img" 256M
          mkfs.ext4 $MKE2FS_OPTS -L data  "$WORK/userdata.img" "$USERDATA_SIZE"

          for img in cache userdata; do
            printf '%-14s %s\n' "$img.img" "$(file -b "$WORK/$img.img")"
            e2fsck -fn "$WORK/$img.img" >/dev/null 2>&1 && echo "   fsck OK" || echo "   fsck 경고"
          done

          # 게스트가 어떤 장치를 기대하는지 직접 확인한다. 추측할 필요가 없다.
          mkdir -p /tmp/boot
          {
            for f in fstab.ranchu fstab.goldfish; do
              if [ -f "$WORK/rd/$f" ]; then
                echo "=== $f ==="; cat "$WORK/rd/$f"
              fi
            done
            # 어느 .rc 가 언제 어떤 fstab 을 마운트하는지. /data 가 안 붙는 이유를 찾는 동안
            # 이걸 계속 추측하고 있었다.
            # 어떤 그래픽 HAL 이 이미지에 실제로 들어 있는지. ranchu 용만 있고
            # default(프레임버퍼)가 없으면 소프트웨어 경로도 막힌다.
            echo "=== system.img 그래픽 HAL ==="
            for d in /lib/hw /lib/egl; do
              echo "-- $d"
              debugfs -R "ls $d" "$WORK/system.img" 2>/dev/null \
                | tr -s ' \t' '\n' | grep -E '\.so$' \
                | grep -E 'gralloc|hwcomposer|EGL|GLES' || echo "   (해당 없음/못 읽음)"
            done
            echo "=== mount_all / on fs ==="
            grep -n -E "mount_all|^on fs|^on post-fs|voldmanaged|encryptable" *.rc 2>/dev/null || echo "(없음)"
            echo "=== 이미지 ==="
            for img in system cache userdata; do
              printf '%-12s label=%-10s %s\n' "$img.img" "$(e2label "$WORK/$img.img" 2>/dev/null)" \
                "$(file -b "$WORK/$img.img" | cut -c1-46)"
            done
          } | tee /tmp/boot/facts.txt

          # 여기서 zip 으로 묶지 않는다. upload-artifact 가 어차피 zip 으로 감싸므로,
          # 미리 묶으면 zip 안에 zip 이 들어가 임포터가 kernel 을 찾지 못한다.
          # 개별 파일을 올려서 아티팩트 zip 자체가 곧 임포트 가능한 ZIP 이 되게 한다.
          rm -rf "$WORK/rd"

          {
            echo "## 결과"
            echo '```'
            ls -la "$WORK"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 폰으로 왕복하지 않고 여기서 바로 부팅시켜 본다. 앱이 만드는 것과 동일한 명령줄을
      # 쓰므로, 여기서 안 뜨면 폰에서도 안 뜬다. 실패해도 아티팩트는 올려야 하니 죽이지 않는다.
      - name: Smoke boot the guest under QEMU
        continue-on-error: true
        env:
          BOOT_SECONDS: "420"
        run: |
          sudo apt-get install -y -qq qemu-system-arm
          WORK="$GITHUB_WORKSPACE/guest-out"
          BOOT=/tmp/boot && mkdir -p "$BOOT/transport"

          # virtio-mmio 는 기본이 force-legacy=true 라 VIRTIO_F_VERSION_1 을 제시하지 않는다.
          # virtio-gpu 는 그 기능을 요구하므로 probe 가 실패하고, 5.10 의 실패 경로가
          # 초기화도 안 된 modeset 을 정리하려다 커널을 oops 시킨다(실측 백트레이스:
          # virtio_gpu_probe -> drm_dev_put -> virtio_gpu_release -> virtio_gpu_modeset_fini).
          # 그 oops 가 init 을 죽여 "Attempted to kill init" 패닉이 났다.
          ARGS=(-machine virt,gic-version=3 -cpu cortex-a15
                -accel tcg,thread=multi,tb-size=256 -smp 2 -m 1024
                -global virtio-mmio.force-legacy=false
                -display none -no-reboot
                -device virtio-gpu-device,xres=480,yres=800
                -device virtio-serial-device)
          for i in 0 1 2 3 4 5 6 7; do
            ARGS+=(-chardev "socket,id=singlevmpipe$i,path=$BOOT/transport/pipe$i.sock,server=on,wait=off")
            ARGS+=(-device "virtserialport,chardev=singlevmpipe$i,name=org.singlevm.pipe.$i")
          done
          ARGS+=(-monitor none -nic none
                 -initrd "$WORK/ramdisk.img"
                 -drive "if=none,id=system,format=raw,readonly=on,file=$WORK/system.img"
                 -device virtio-blk-device,drive=system
                 -drive "if=none,id=cache,format=raw,file=$WORK/cache.img"
                 -device virtio-blk-device,drive=cache
                 -drive "if=none,id=userdata,format=raw,file=$WORK/userdata.img"
                 -device virtio-blk-device,drive=userdata
                 -append "console=ttyAMA0 earlycon=pl011,0x09000000 keep_bootcon ignore_loglevel printk.devkmsg=on qemu=1 qemu.gles=1 androidboot.console=ttyAMA0 androidboot.hardware=ranchu androidboot.selinux=permissive binder.devices=binder,hwbinder,vndbinder rdinit=/init.wrapper root=/dev/ram0 rw")

          # 게스트가 vdc 를 쓰기 금지로 본다면 그 원인이 호스트 쪽일 수 있다.
          # 권한과 QEMU 가 읽은 형식을 부팅 직전에 남긴다.
          {
            ls -la "$WORK"/*.img
            for i in system cache userdata; do
              echo "--- $i.img"; qemu-img info "$WORK/$i.img" 2>&1 | head -5
            done
          } > /tmp/boot/images.txt

          boot_with() {   # $1 = 라벨, $2 = 커널 경로
            local label="$1" kern="$2"
            local serial="$BOOT/serial-$label.log" stdout="$BOOT/qemu-$label.log"
            rm -f "$serial" "$stdout"
            echo "==> [$label] $(file -b "$kern")"

            # 앱에서는 libemugl_probe.so 가 이 소켓들에 붙는다. CI 에는 렌더러가 없어
            # 아무도 안 붙고, 그래서 게스트가 파이프를 여는지조차 볼 수 없었다.
            # 듣기만 하는 대역을 띄워 "게스트 -> 호스트" 방향을 실제로 확인한다.
            python3 guest/qemu_pipe/host_listener.py "$BOOT/transport" \
              > "$BOOT/pipe-listener.log" 2>&1 &
            local listener=$!

            timeout "$BOOT_SECONDS" qemu-system-aarch64 "${ARGS[@]}" \
              -serial "file:$serial" -kernel "$kern" > "$stdout" 2>&1 || true
            kill "$listener" 2>/dev/null || true
            local size
            size=$(stat -c%s "$serial" 2>/dev/null || echo 0)
            {
              echo "## [$label] 시리얼 출력: ${size} bytes"
              if [ "$size" -gt 0 ]; then
                # 결정적인 줄들만 먼저. init.wrapper 와 vport 는 부팅 끝에 나오므로
                # head 로 자르면 정작 필요한 부분이 잘려 나간다.
                echo "### 핵심 줄"
                echo '```'
                grep -aE "init\.wrapper|vport|virtio.console|virtio_console|Kernel panic|Freeing initrd|Run /|Unable to mount|No filesystem|end Kernel" \
                  "$serial" | sort -u | head -40 || echo "(해당 없음)"
                echo '```'
                echo "### 마지막 6000 bytes"
                echo '```'
                tail -c 6000 "$serial"
                echo '```'
              else
                echo '```'
                echo "(무음)"
                echo '```'
              fi
              echo "QEMU 자체 출력:"
              echo '```'
              head -c 1500 "$stdout" || true
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          }

          # 1) 실제로 패키징되는 커널 (직접 빌드한 virt 용, 없으면 SDK 폴백)
          boot_with packaged "$WORK/kernel"

          # Debian 대조군은 "virt + 램디스크 + init.wrapper 배관은 정상, 문제는 커널"을
          # 증명하는 역할을 이미 다했다. 이제는 시간만 잡아먹으므로 뺀다.

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-boot-logs
          path: |
            /tmp/boot/serial-*.log
            /tmp/boot/qemu-*.log
            /tmp/boot/pipe-listener.log
          if-no-files-found: warn

      - name: Show disk space after
        if: always()
        run: df -h /

      # 받은 아티팩트 zip 을 그대로 앱의 "Android 7 구성 가져오기"에 넣으면 된다.
      # 임포터는 ZIP 안에서 경로를 무시하고 basename 으로 찾으므로 디렉터리 접두사는 무해하다.
      - uses: actions/upload-artifact@v4
        with:
          name: android7-guest
          path: |
            guest-out/kernel
            guest-out/ramdisk.img
            guest-out/system.img
            guest-out/userdata.img
            guest-out/cache.img
          if-no-files-found: error
          compression-level: 6

      # 커널 빌드 로그만 수천 줄이라, 정작 필요한 결론이 로그 한가운데 묻힌다.
      # job 마지막에 다시 찍어서 tail 만 봐도 판정이 서게 한다.
      - name: Verdict
        if: always()
        run: |
          # 조립 단계에서 찍은 사실들. 로그 한가운데라 매번 놓쳐서 여기로 끌어온다.
          if [ -f kernel-config.txt ]; then
            echo "########## 커널 설정"; cat kernel-config.txt; echo
          fi
          if [ -f /tmp/boot/facts.txt ]; then
            echo "########## 게스트가 기대하는 구성"
            cat /tmp/boot/facts.txt
            echo
          fi
          # 순서가 중요하다. 이 판정 출력은 로그 뷰어에서 끝부분만 보이는 일이 잦아서,
          # 결정적인 줄(마운트 실패 이유, 감시자의 직접 확인 결과)을 마지막에 둔다.
          for f in /tmp/boot/serial-*.log; do
            [ -f "$f" ] || continue
            label=$(basename "$f" .log | sed 's/^serial-//')
            size=$(stat -c%s "$f")
            echo "===================== $label  (${size} bytes)"
            if [ "$size" -eq 0 ]; then echo "  무음 — 커널이 출력을 내지 못함"; continue; fi

            # 중복 제거: keep_bootcon 때문에 모든 줄이 두 번 찍힌다. avc 감사 로그는
            # permissive 라 무해한데 수십 줄이라 정작 볼 것을 밀어낸다.
            # 커널이 init 으로 넘어가는 구간. 여기서 죽으면 나머지 필터는 전부 빈손이라
            # 무슨 일이 있었는지 알 방법이 없다.
            echo "  --- 커널 -> init 인계 ---"
            grep -aE "Kernel command line|Uncompressing|Freeing initrd|Run /|rdinit|Attempted to kill init|Trying to unpack|initramfs|Failed to execute|request_module|drm|virtio_gpu|fb0|Console: |Warning: unable" "$f" \
              | sed 's/^\[[0-9. ]*\] //' | awk '!k[$0]++' | head -24

            echo "  --- 부팅 경로 ---"
            grep -aE "init\.wrapper: (start|OK|FAIL|vport|exec|watchdog)|Kernel panic|first stage|second stage|fs_mgr|__mount|EXT4-fs|reboot:|zygote|Zygote|servicemanager|surfaceflinger|SurfaceFlinger|bootanim|system_server|Starting service|returned an error|cgroup" "$f" \
              | grep -avE "not defined in policy|Class .* not defined|avc:  denied" \
              | sed 's/^\[[0-9. ]*\] //' | awk '!seen[$0]++' | head -40

            # 죽는 서비스가 스스로 남긴 말. 위 필터는 head 로 잘려서 여기까지 못 온다.
            # 부팅이 실제로 어디까지 갔는가. 이제 관심사는 "왜 죽었나"가 아니라
            # "얼마나 멀리 갔나"다.
            echo "  --- 도달한 지점 ---"
            grep -aE "SystemServer|ActivityManager: Displayed|Boot is finished|BOOT_COMPLETED|bootanim|SurfaceFlinger: Boot|zygote.*Preload|PackageManager: Time to scan|Enabled StrictMode" "$f" \
              | sed 's/^\[[0-9. ]*\] //' | awk '!b[$0]++' | tail -14

            # SurfaceFlinger 는 지금 부팅의 마지막 관문이라 따로 본다. abort 사유와
            # 그래픽 HAL 로딩 결과가 다른 로그에 밀리지 않게 자기 구간을 준다.
            echo "  --- SurfaceFlinger / 그래픽 ---"
            grep -aE "Abort message|SurfaceFlinger|surfaceflinger|libEGL|EGL|gralloc|hwcomposer|HWComposer|RenderEngine|emulation|qemu_pipe|OpenglSystemCommon|HostConnection" "$f" \
              | grep -avE "init\.wrapper: wd |Starting service|killed by signal 9" \
              | sed 's/^\[[0-9. ]*\] //' | awk '!g[$0]++' | tail -26

            echo "  --- 죽은 서비스가 남긴 말 ---"
            grep -aE "Abort message|surfaceflinger|SurfaceFlinger|gralloc|hwcomposer|qemu_pipe|libEGL|EGL_|eglInitialize|HAL module|hw_get_module|Terminating|exited with status|killed by signal|SELinux: Failed|servicemanager" "$f" \
              | grep -avE "init\.wrapper: wd |Starting service|killed by signal 9" \
              | sed 's/^\[[0-9. ]*\] //' | awk '!s[$0]++' | tail -26

            echo "  --- 감시자 마지막 상태 ---"
            grep -a "init\.wrapper: wd t=.* mnt:" "$f" | sed 's/^\[[0-9. ]*\] //' | awk '!m[$0]++' | tail -2
            grep -a "init\.wrapper: wd t=.* p1 init" "$f" | sed 's/^\[[0-9. ]*\] //' | awk '!q[$0]++' | tail -1

            # 여기부터가 이번 라운드의 답이다. 맨 끝에 둬야 잘리지 않는다.
            if [ -f /tmp/boot/images.txt ]; then
              echo "  --- 호스트가 넘긴 이미지 ---"; cat /tmp/boot/images.txt
            fi
            for q in /tmp/boot/qemu-*.log; do
              [ -s "$q" ] || continue
              echo "  --- QEMU 경고 ---"; head -c 1200 "$q"; echo
            done
            # 전송로 검증: 게스트가 보낸 바이트가 호스트 소켓까지 왔는가.
            echo "  --- goldfish pipe 전송로 (호스트 소켓) ---"
            if [ -s /tmp/boot/pipe-listener.log ]; then
              head -24 /tmp/boot/pipe-listener.log
            else
              echo "  (청취기 출력 없음)"
            fi

            echo "  --- 게스트가 직접 확인한 결과 ---"
            if grep -aqE "init\.wrapper: wd (probe|dev)" "$f"; then
              grep -aE "init\.wrapper: wd (probe|dev)" "$f" | sed 's/^\[[0-9. ]*\] //' | awk '!p[$0]++' | head -24
            else
              echo "  (probe 출력 없음 — /data 가 붙었거나 감시자가 죽음)"
            fi
            # 마지막에 진짜 마지막 줄. 게스트가 스스로 죽으면 이유가 여기에만 남는다
            # (패닉, init 의 리부트 요청 등). 필터를 거치지 않은 원본이어야 한다.
            echo "  --- 시리얼 로그 원본 마지막 줄 ---"
            tail -n 40 "$f" | sed 's/^\[[0-9. ]*\] //' | awk '!t[$0]++' | tail -22

            # 맨 마지막에 둔다. 지금 알아내야 하는 것이 이것 하나뿐인데, 앞쪽에 두면
            # 로그 뷰어의 표시 한계에 계속 잘려서 세 번을 놓쳤다.
            echo "  ########## qemu_piped / pipetest (지금 보려는 것) ##########"
            grep -aE "qemu_piped:|pipetest:" "$f" | sed 's/^\[[0-9. ]*\] //' \
              | awk '!d[$0]++' | head -24 || echo "  (출력 없음 - 데몬이 아예 안 떴다)"
          done