name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK platform 34 / build-tools 34
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify native libs are packaged uncompressed-free (extractNativeLibs)
        run: |
          # libqemu-system-aarch64.so / libpodroid-launcher.so are PIE executables
          # that GuestRunActivity execs by path, so they must be extractable.
          apk=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" | grep -E "lib/arm64-v8a/(libqemu-system-aarch64|libpodroid-launcher)\.so"
          if unzip -p "$apk" AndroidManifest.xml | grep -qa extractNativeLibs; then
            echo "extractNativeLibs attribute present in manifest"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
